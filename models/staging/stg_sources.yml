version: 2

sources:
  - name: ticketing
    database: raw
    schema: ticketing
    tables:
      - name: orders
        config:
          loaded_at_field: _loaded_at
          freshness:
            warn_after: {count: 6, period: hour}
            error_after: {count: 12, period: hour}
        columns:
          - name: order_id
            data_tests:
              - not_null
          - name: event_id
          - name: customer_id
          - name: order_ts
          - name: quantity
          - name: unit_price
          - name: status
          - name: _loaded_at

      - name: events
        columns:
          - name: event_id
            data_tests:
              - unique
              - not_null
          - name: event_name
          - name: venue_id
          - name: event_type

      - name: refunds
        columns:
          - name: refund_id
            data_tests:
              - unique
              - not_null
          - name: order_id
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('ticketing', 'orders')
                    field: order_id
          - name: refund_amount
          - name: refunded_at