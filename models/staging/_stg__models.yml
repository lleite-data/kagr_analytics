version: 2

models:
  - name: orders
    description: One per order_id, event_id, customer_id
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
      - name: event_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('events')
                field: event_id
              config:
                severity: warn
      - name: customer_id
        data_tests:
          - not_null
      - name: order_date
        data_tests:
          - not_null
      - name: quantity
        data_tests:
          - not_null
      - name: unit_price
        data_tests:
          - not_null
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['COMPLETED','PENDING','REFUNDED']

  - name: events
    description: Events data per event_id
    columns:
      - name: event_id
        data_tests:
          - not_null
          - unique
      - name: event_name
      - name: venue_id
      - name: event_type
  
  - name: refunds
    description: One per refund_id, order_id
    columns:
      - name: refund_id
        data_tests:
          - not_null
          - unique
      - name: order_id
        data_tests:
          - not_null
      - name: refund_amount
        data_tests:
          - not_null
      - name: refunded_at
        data_tests:
          - not_null
          

        

          
        
      